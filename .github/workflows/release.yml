name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Upload agentdvr-card.js to release
        uses: softprops/action-gh-release@v2
        with:
          files: agentdvr-card.js
